name: wordpress-nginx
type: service
from: php-nginx
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.7"
title: Nginx (WordPress)


labels:
- wordpress

build:
  link: backend
  dockerfile: Dockerfile

configs:
- name: preset
  title: WordPress preset
  filepath: /etc/gotpl/preset/wordpress.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/presets/wordpress.conf.tmpl

settings:
- name: docroot
  title: Nginx docroot
  from: backend
  var: DOCROOT_SUBDIR
  build: true

volumes:
- name: wp-content
  from: backend
  title: WP content
  path: /mnt/files

env:
- name: NGINX_VHOST_PRESET
  value: wordpress
