name: wordpress-nginx
type: service
from: php-nginx
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.3"
title: Nginx (WordPress)


labels:
- wordpress

build:
  dockerfile: Dockerfile

configs:
- name: preset
  title: WordPress preset
  filepath: /etc/gotpl/preset/wordpress.conf.tmpl
  config: preset.conf.tmpl
- name: preset
  title: WordPress preset
  filepath: /etc/gotpl/preset/wordpress.conf.tmpl
  config: preset.conf.1.27.tmpl
  version: '1.27'
- name: preset
  title: WordPress preset
  filepath: /etc/gotpl/preset/wordpress.conf.tmpl
  config: preset.conf.1.25.tmpl
  version: '1.25'

settings:
- name: docroot
  title: Nginx docroot
  from: backend
  var: DOCROOT_SUBDIR
  build: true

volumes:
- name: wp-content
  from: backend
  title: WP content
  path: /mnt/files

env:
- name: NGINX_VHOST_PRESET
  value: wordpress
